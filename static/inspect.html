<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Model inspector — Career Path Transformer</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/static/style.css">
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
  /* Full-page inspector layout on top of the demo stylesheet */
  main.inspector { display: block; max-width: 1500px; margin: 0 auto; padding: 14px 18px 60px; }
  .inspector .panel { margin-bottom: 14px; }
  .inspector h1 { font-size: 19px; margin: 0; }
  .inspector h1 .title-token { text-transform: capitalize; }
  .inspector h2 { font-size: 15px; margin: 18px 0 6px; }
  .inspector h3 { font-size: 13px; margin: 12px 0 4px; color: var(--muted); }
  .inspector .meta-row { display: flex; flex-wrap: wrap; gap: 14px; color: var(--muted); font-size: 12.5px; margin-top: 4px; }
  .inspector #resume-tokens { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .inspector table.kv.lens { width: auto; }
  .inspector table.kv.lens th { text-align: left; font-size: 11px; color: var(--muted);
    border-bottom: 1px solid var(--line); padding: 3px 14px 3px 0; }
  .inspector table.kv.lens td { padding: 3px 14px 3px 0; }
  .inspector .heatmap { width: 100%; }
  .inspector details.mask-weights { margin: 2px 0 14px; font-size: 12.5px; }
  .inspector details.mask-weights summary { cursor: pointer; color: var(--accent); }
  /* Fixed columns so every row's bars and numbers line up: token label |
     bars (flex) | score. Variable-width labels were skewing the bars. */
  .inspector .contrib-row .tok {
    flex: 0 0 300px;
    max-width: 300px;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .inspector .contrib-row .bar-wrap { flex: 1; max-width: 500px; }
  .inspector .err { color: #b91c1c; }
  .inspector .not-displayable {
    max-width: 560px;
    margin: 60px auto;
    text-align: center;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 28px;
    background: #fafbfd;
  }
  .inspector .not-displayable h2 { margin-top: 0; }
  .inspector h4 { font-size: 12.5px; margin: 10px 0 2px; color: var(--ink); }
  .inspector details.flow-details { margin: 4px 0 10px; }
  .inspector details.flow-details > summary { cursor: pointer; color: var(--accent); font-size: 12.5px; }
  .inspector details.sec { margin: 14px 0; border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; background: var(--panel); }
  .inspector details.sec > summary { cursor: pointer; }
  /* Hint on its own line under the heading — inline it wraps mid-sentence
     around the disclosure triangle and reads broken. */
  .inspector details.sec > summary .hint { display: block; margin: 2px 0 0 18px; max-width: 110ch; }
  .inspector details.flow-details { border-left: 2px solid var(--line); padding-left: 12px; }
  .inspector .weights-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 10px;
    margin-top: 6px;
  }
  .inspector .weights-grid .hint { margin: 0 0 2px; }
  .inspector .bar-pair { flex: 1 0 0; display: flex; flex-direction: column; gap: 2px; max-width: 500px; }
  .inspector .bar-pair .bar-wrap { flex: none; width: 100%; max-width: none; }
  .inspector .contrib-row .bar.vw { background: #b91c1c; }
  /* Centre-zero signed bars for the leave-one-out influence */
  .inspector .bar-wrap.center { position: relative; height: 10px; }
  .inspector .bar-wrap.center::before {
    content: '';
    position: absolute;
    left: 50%; top: -1px; bottom: -1px;
    border-left: 1px solid var(--muted);
  }
  .inspector .bar-wrap.center .bar { position: absolute; top: 1.5px; height: 7px; }
  .inspector .bar-wrap.center .bar.pos { left: 50%; background: #059669; }
  .inspector .bar-wrap.center .bar.neg { right: 50%; background: #b91c1c; }
  .inspector .contrib-row .score {
    flex: 0 0 170px;
    text-align: right;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;   /* never split a number across lines */
  }
</style>
</head>
<body>

<main class="inspector">
  <section class="panel">
    <h1 id="head">Model inspector</h1>
    <div class="meta-row" id="meta"></div>
    <div id="resume-tokens"></div>
    <p class="hint" id="topn-ctrl" style="margin-top:8px; display:none">
      Show top <input id="top-n" type="number" min="1" placeholder="all"
        style="width:64px"> tokens per influence list
      <span class="hint">(blank = every token; ranked by magnitude)</span>
    </p>
  </section>
  <section class="panel" id="content"><p class="hint">Loading model internals…</p></section>
</main>

<script>
const $ = (sel) => document.querySelector(sel);

// Plotly heatmaps laid out inside a closed <details> have zero width —
// resize any plots in a section when it is opened.
document.addEventListener('toggle', (e) => {
  if (e.target.open) {
    e.target.querySelectorAll('.js-plotly-plot').forEach(p => Plotly.Plots.resize(p));
  }
}, true);

// Single-hue sequential ramp (attention weight = magnitude): surface → dark blue.
const ATTN_SCALE = [[0, '#f8fafc'], [1, '#1e40af']];

function short(tok) { return tok.includes(':') ? tok.split(/:(.*)/)[1] : tok; }
function tokType(tok) { return tok.includes(':') ? tok.split(':')[0] : tok; }

function fail(msg, notDisplayable = false) {
  $('#content').innerHTML = notDisplayable ? `
    <div class="not-displayable">
      <h2>Model not displayable</h2>
      <p>${msg}</p>
      <p class="hint">This architecture has no visualisation support in the demo
        yet. Its run parameters and metrics are still available in the model
        dropdown's info panel and the compare-parameters table.</p>
      <p><a href="/">← back to the demo</a></p>
    </div>` : `<p class="err">${msg}</p>`;
}

function renderHeader(payload) {
  $('#head').innerHTML = `Why “<span class="title-token">${short(payload.title)}</span>”?
    <span class="hint">— ${payload.label}</span>`;
  const target = payload.target
    ? `<span>actual next role: <b>${short(payload.target)}</b></span>` : '';
  $('#meta').innerHTML = `<span>model run: <code>${payload.model}</code></span>${target}
    <span>${payload.tokens.length} resume tokens</span>`;
  $('#resume-tokens').innerHTML = payload.tokens
    .map(t => `<span class="tok ${tokType(t)}">${t}</span>`).join('');
}

function renderItem2vec(data) {
  const max = Math.max(...data.contributions.map(c => Math.abs(c.cosine)), 1e-9);
  $('#content').innerHTML = `
    <h2>Per-token pull toward the title <span class="hint">cosine of each context
      token vs the title vector · overall ranking score ${data.score.toFixed(4)}
      (item2vec has no layers — this is the whole computation)</span></h2>
    ${data.contributions.map(c => `
      <div class="contrib-row">
        <span class="tok ${c.type}">${c.token}</span>
        <span class="bar-wrap"><span class="bar${c.cosine < 0 ? ' neg' : ''}"
          style="width:${Math.max(2, 100 * Math.abs(c.cosine) / max)}%"></span></span>
        <span class="score">${c.cosine.toFixed(4)}</span>
      </div>`).join('')}`;
}

// Diverging scale for SIGNED data (learned weights, hidden-state values):
// blue = negative, neutral surface at zero, red = positive.
const DIV_SCALE = [[0, '#1e40af'], [0.5, '#f8fafc'], [1, '#b91c1c']];

// Generic heatmap helper — signed data gets the diverging scale centred on 0.
function heat(el, z, o = {}) {
  Plotly.newPlot(el, [{
    z, type: 'heatmap',
    ...(o.signed ? { colorscale: DIV_SCALE, zmid: 0 } : { colorscale: ATTN_SCALE, zmin: 0 }),
    ...(o.zmax !== undefined ? { zmax: o.zmax } : {}),
    ...(o.customdata ? { customdata: o.customdata } : {}),
    ...(o.text ? { texttemplate: '%{z:.2f}', textfont: { size: 9 } } : {}),
    colorbar: { thickness: 8, tickfont: { size: 8 } },
    hovertemplate: o.hover || 'row %{y} · col %{x}<br>%{z:.4f}<extra></extra>',
  }], {
    margin: { l: o.ml || 60, r: 46, t: 6, b: o.mb || 42 },
    xaxis: { tickfont: { size: 8 }, ...(o.xaxis || {}) },
    yaxis: { tickfont: { size: 8 }, ...(o.yaxis || {}) },
    ...(o.shapes ? { shapes: o.shapes } : {}),
    height: o.height || 240,
  }, { displayModeBar: false, responsive: true });
  return el;
}

// Top-level page section — a collapsible <details> so heavy blocks can be
// folded away (executive view) but expanded to full granularity when needed.
function section(parent, title, hint, open = true, kind = 'h2') {
  const det = document.createElement('details');
  det.className = 'sec';
  det.open = open;
  det.innerHTML = `<summary><${kind} style="display:inline">${title}</${kind}>
    ${hint ? `<span class="hint">${hint}</span>` : ''}</summary>`;
  parent.appendChild(det);
  const div = document.createElement('div');
  det.appendChild(div);
  return div;
}

function collapsible(parent, summary, open = false) {
  const det = document.createElement('details');
  det.className = 'flow-details';
  det.open = open;
  det.innerHTML = `<summary>${summary}</summary>`;
  parent.appendChild(det);
  return det;
}

function renderBert4rec(data) {
  const box = $('#content');
  const L = data.labels.length;
  const d = data.d_model;
  const showValues = L <= 28;                       // printed weights when readable

  // Full prefixed tokens for the axes, colour-coded like the header chips
  // (work = blue, education = green, skills = amber, [MASK] = red).
  const fullTokens = data.labels.map((l, i) =>
    data.token_types[i] === 'MASK' ? '[MASK]' : `${data.token_types[i]}:${l}`);
  const TICK_COLOR = { E: '#059669', S: '#b45309', MASK: '#dc2626' };
  const tickColor = (i) => {
    const t = data.token_types[i];
    return TICK_COLOR[t === 'MASK' ? 'MASK' : t[0]] || '#2563eb';   // W_* = work blue
  };
  const trunc = (s) => (s.length > 34 ? s.slice(0, 32) + '…' : s);
  const tickvals = [...fullTokens.keys()];
  const ticktext = fullTokens.map((f, i) =>
    `<span style="color:${tickColor(i)}">${trunc(f)}</span>`);
  const tokenAxis = { tickmode: 'array', tickvals, ticktext };
  // Numeric axes + explicit tick text: keeps duplicate tokens (two identical
  // tenures/skills) as separate positions — category axes would merge them.
  const customdata = fullTokens.map(q => fullTokens.map(k => [q, k]));
  const maxLabel = Math.max(...fullTokens.map(f => Math.min(f.length, 34)));
  const tokML = Math.min(260, 7 * maxLabel + 50);

  const lensRows = data.layers.map(l => `
    <tr><td>${l.name}</td>
      <td>${l.title_logit.toFixed(3)}</td>
      <td>${l.title_prob !== undefined ? (l.title_prob * 100).toFixed(3) + '%' : '—'}</td>
      <td>${l.title_rank !== undefined ? '#' + l.title_rank : '—'}</td>
      <td>${l.top_titles.map(t => `${t.title} (${(t.prob * 100).toFixed(1)}%)`).join(' · ')}</td>
    </tr>`).join('');
  box.innerHTML = `
    ${data.faithful === false
      ? '<p class="err">The instrumented re-run diverged from the encoder — treat these internals as approximate.</p>' : ''}
    ${data.backbone === 'modernbert'
      ? `<p class="hint">ModernBERT backbone: pre-norm blocks, RoPE (no absolute
         positions), GeGLU FFN, bias-free. Per-stage lens readouts apply the
         model's final LayerNorm (pre-norm residuals are only head-comparable
         through it); trace vectors show the raw residual stream.</p>` : ''}
    <h2>Logit lens <span class="hint">the [MASK] hidden state after each layer,
      projected through the (tied) output head — where this title's score forms.
      The rest of this page IS the model, in forward-pass order: input embeddings
      → per-layer attention heads (their learned weights, patterns and actual
      influence) → FFN weights → the residual-stream trace of every token.</span></h2>
    <table class="kv lens">
      <tr><th>after</th><th>title logit</th><th>in-domain prob</th><th>rank</th>
          <th>top titles at this depth</th></tr>
      ${lensRows}
    </table>`;

  // ── 0 · Per-token influence on THIS title (leave-one-out) ───────────────
  if (data.ablation) {
    const ab = data.ablation;
    const infl = section(box, `0 · Per-token influence on “${short(data.title)}”`,
      `leave-one-out: the model is re-run with each token removed; the bar is the
       resulting change in this title's logit (green = the token pushes the
       prediction TOWARD the title, red = away). Numbers: Δlogit · Δprobability.
       Baseline logit ${ab.base_logit.toFixed(3)}${ab.base_prob !== null
         ? `, in-domain prob ${(ab.base_prob * 100).toFixed(2)}%` : ''}.`);
    infl.classList.add('token-influence');
    const maxAbs = Math.max(1e-9, ...ab.tokens.map(t => Math.abs(t.delta_logit)));
    const order = [...ab.tokens].sort((a, b) => b.delta_logit - a.delta_logit);
    infl.innerHTML = order.map(t => `
      <div class="contrib-row">
        <span class="tok ${data.token_types[t.i]}">${fullTokens[t.i]}</span>
        <span class="bar-wrap center">
          <span class="bar ${t.delta_logit >= 0 ? 'pos' : 'neg'}"
            style="width:${Math.max(1, 50 * Math.abs(t.delta_logit) / maxAbs)}%"></span>
        </span>
        <span class="score">${t.delta_logit >= 0 ? '+' : ''}${t.delta_logit.toFixed(3)}
          ${t.delta_prob !== null
            ? ` · ${t.delta_prob >= 0 ? '+' : ''}${(t.delta_prob * 100).toFixed(2)}pp` : ''}</span>
      </div>`).join('');
  }

  // ── DenseRec dual-path alignment ─────────────────────────────────────────
  if (data.denserec) {
    const dr = data.denserec;
    const al = section(box, 'DenseRec · dual-path alignment',
      `cosine between each token's learned ID embedding and its projected MiniLM
       content vector (dense_path_p=${dr.dense_path_p}, d_c=${dr.content_dim}).
       High = the two paths agree; low on a rare title means the content path
       would place it somewhere training never put its ID. Note: this trace is
       the in-vocab ID path — injected out-of-vocabulary tokens are scored by
       the model but not traced here.`);
    al.classList.add('token-influence');
    const maxAbs = Math.max(1e-9, ...dr.alignment.map(r => Math.abs(r.cosine)));
    al.innerHTML = dr.alignment
      .slice().sort((a, b) => b.cosine - a.cosine)
      .map(r => `
        <div class="contrib-row">
          <span class="tok ${r.type}">${r.token}${r.is_title ? ' ← clicked title' : ''}</span>
          <span class="bar-wrap center">
            <span class="bar ${r.cosine >= 0 ? 'pos' : 'neg'}"
              style="width:${Math.max(1, 50 * Math.abs(r.cosine) / maxAbs)}%"></span>
          </span>
          <span class="score">${r.cosine.toFixed(3)}</span>
        </div>`).join('');
  }

  // ── 1 · Input embeddings ─────────────────────────────────────────────────
  const emb = section(box, '1 · Input embeddings',
    `each token's vector entering the encoder (embedding + position, normalised)
     — rows are tokens, columns the ${d} model dimensions`);
  heat(emb.appendChild(document.createElement('div')), data.trace.vectors[0], {
    signed: true, ml: tokML, yaxis: { ...tokenAxis, autorange: 'reversed' },
    hover: 'dim %{x}<br>%{y}<br>value %{z:.3f}<extra></extra>',
    height: Math.max(220, 13 * L + 90),
  });

  // Shared scales so equal colour/bar = equal value across every layer & head.
  const attnMax = Math.max(1e-9, ...data.layers.filter(l => l.attention)
    .flatMap(l => l.attention.flat(2)));
  const vwMax = Math.max(1e-9, ...data.layers.filter(l => l.mask_value_weighted)
    .flatMap(l => l.mask_value_weighted.flat()));

  // ── 2 · Encoder layers ───────────────────────────────────────────────────
  const enc = section(box, '2 · Encoder layers',
    `per head: the learned projections (W<sub>Q</sub>/W<sub>K</sub>/W<sub>V</sub>
     rows for the head, W<sub>O</sub> columns that write it back), the attention
     pattern, and the [MASK] influence — attention weight × the norm of the
     value the token writes (what actually moves the prediction). Attention
     panels share one scale; influence bars share another.`);

  let firstLayer = true;
  for (const layer of data.layers) {
    if (!layer.attention) continue;
    // Whole layer folds away; the first is open so the page leads with substance.
    const ldet = collapsible(enc, `<b>${layer.name}</b>`, firstLayer);
    firstLayer = false;
    const lbox = document.createElement('div');
    ldet.appendChild(lbox);
    lbox.insertAdjacentHTML('beforeend', `
      <p class="hint">Block function: every token's vector is refined in two
      steps. <b>Attention</b> lets each token pull in information from the
      others — each head below computes its own queries (what a token is
      looking for), keys (what a token can be found by) and values (what it
      hands over when attended to). <b>The FFN</b> then transforms each token
      independently. Both are added back onto the token's running
      representation (the residual stream).</p>`);

    layer.attention.forEach((matrix, h) => {
      const hdet = collapsible(lbox, `<b>head ${h + 1}</b> of ${data.n_heads}`, h === 0);
      const encHead = document.createElement('div');
      hdet.appendChild(encHead);

      // (a) the head's learned weights — collapsed by default
      const wdet = collapsible(encHead,
        `projection weights — W_Q, W_K, W_V (head rows × ${d} dims) and W_O<sup>T</sup> (write-back)`);
      const grid = document.createElement('div');
      grid.className = 'weights-grid';
      wdet.appendChild(grid);
      const W = layer.heads[h];
      for (const [name, z] of [['W_Q', W.wq], ['W_K', W.wk], ['W_V', W.wv], ['W_Oᵀ', W.wo_t]]) {
        const cell = document.createElement('div');
        cell.innerHTML = `<p class="hint">${name}</p>`;
        grid.appendChild(cell);
        heat(cell.appendChild(document.createElement('div')), z, {
          signed: true, ml: 40, mb: 30, height: 190,
          hover: name + ' head-dim %{y} · model-dim %{x}<br>%{z:.3f}<extra></extra>',
        });
      }

      // (b) attention arithmetic — the actual matrices flowing through this
      // head, in computation order. softmax(scores) = the pattern in (c), so
      // the whole calculation can be followed number by number.
      const st = (layer.attn_steps || [])[h];
      if (st) {
        const hd = st.q[0].length;
        const sdet = collapsible(encHead,
          `attention arithmetic, step by step — Q, K, scores = QKᵀ/√${hd}, softmax, V, output`);
        const stepHint = (t) => `<p class="hint">${t}</p>`;
        const dimAxes = { ml: tokML, mb: 30, yaxis: { ...tokenAxis, autorange: 'reversed' },
          hover: '%{y}<br>head-dim %{x}<br>%{z:.3f}<extra></extra>' };
        sdet.insertAdjacentHTML('beforeend', stepHint(
          `<b>1 · Q = X·W_Qᵀ</b> — each token's query (${hd} dims): what it is looking for` +
          (data.backbone === 'modernbert' ? ' (RoPE position rotation applied)' : '')));
        heat(sdet.appendChild(document.createElement('div')), st.q,
          { signed: true, height: Math.max(180, 13 * L + 70), ...dimAxes });
        sdet.insertAdjacentHTML('beforeend', stepHint(
          `<b>2 · K = X·W_Kᵀ</b> — each token's key: what it can be found by`));
        heat(sdet.appendChild(document.createElement('div')), st.k,
          { signed: true, height: Math.max(180, 13 * L + 70), ...dimAxes });
        sdet.insertAdjacentHTML('beforeend', stepHint(
          `<b>3 · scores = QKᵀ/√${hd}</b> — every query dotted with every key,
           scaled: the raw, pre-softmax alignment (row = querying token,
           column = attended token)`));
        heat(sdet.appendChild(document.createElement('div')), st.scores, {
          signed: true, customdata, ml: tokML, mb: Math.min(220, 6 * maxLabel + 60),
          xaxis: { ...tokenAxis, tickangle: 45 }, yaxis: { ...tokenAxis, autorange: 'reversed' },
          hover: 'query %{customdata[0]}<br>key %{customdata[1]}<br>score %{z:.3f}<extra></extra>',
          height: Math.min(1000, Math.max(320, 16 * L + 180)),
        });
        sdet.insertAdjacentHTML('beforeend', stepHint(
          `<b>4 · weights = softmax(scores)</b> — each row normalised to sum
           to 1: the attention pattern shown in full below`));
        sdet.insertAdjacentHTML('beforeend', stepHint(
          `<b>5 · V = X·W_Vᵀ</b> — each token's value: the content it hands
           over when attended to`));
        heat(sdet.appendChild(document.createElement('div')), st.v,
          { signed: true, height: Math.max(180, 13 * L + 70), ...dimAxes });
        sdet.insertAdjacentHTML('beforeend', stepHint(
          `<b>6 · output = weights · V</b> — the head's result per token: a
           weighted mix of the values it attended to, written back into the
           residual stream through W_O`));
        heat(sdet.appendChild(document.createElement('div')), st.head_out,
          { signed: true, height: Math.max(180, 13 * L + 70), ...dimAxes });
      }

      // (c) attention pattern
      heat(encHead.appendChild(Object.assign(document.createElement('div'), { className: 'heatmap' })),
        matrix, {
          zmax: attnMax, customdata, text: showValues,
          ml: tokML, mb: Math.min(220, 6 * maxLabel + 60),
          xaxis: { ...tokenAxis, tickangle: 45 },
          yaxis: { ...tokenAxis, autorange: 'reversed' },
          hover: 'query %{customdata[0]}<br>key %{customdata[1]}<br>weight %{z:.4f}<extra></extra>',
          shapes: [{ type: 'rect', x0: -0.5, x1: L - 0.5, y0: L - 1.5, y1: L - 0.5,
                     line: { color: '#dc2626', width: 2 } }],
          height: Math.min(1400, Math.max(420, 20 * L + 200)),
        });

      // (d) [MASK] influence — attention vs value-weighted, sorted by the latter
      const vw = layer.mask_value_weighted[h];
      const maskRow = matrix[L - 1];
      const order = [...vw.keys()].sort((a, b) => vw[b] - vw[a]);
      const det = collapsible(encHead,
        `[MASK] influence, sorted — attention (blue) vs value-weighted (red), ${L} positions`, true);
      det.classList.add('mask-weights', 'token-influence');
      det.insertAdjacentHTML('beforeend', order.map(i => `
        <div class="contrib-row">
          <span class="tok ${data.token_types[i]}">${fullTokens[i]}</span>
          <span class="bar-pair">
            <span class="bar-wrap"><span class="bar"
              style="width:${Math.max(1, 100 * maskRow[i] / attnMax)}%"></span></span>
            <span class="bar-wrap"><span class="bar vw"
              style="width:${Math.max(1, 100 * vw[i] / vwMax)}%"></span></span>
          </span>
          <span class="score">${maskRow[i].toFixed(3)} · ${vw[i].toFixed(3)}</span>
        </div>`).join(''));
    });

    // (e) the layer's FFN weights
    const f = collapsible(lbox,
      `${layer.name} · FFN weights — W₁ (${layer.ffn.w1.length}×${d}, expand) then W₂ (${d}×${layer.ffn.w2[0].length}, contract)`);
    for (const [name, z] of [['W₁', layer.ffn.w1], ['W₂', layer.ffn.w2]]) {
      f.insertAdjacentHTML('beforeend', `<p class="hint">${name}</p>`);
      heat(f.appendChild(document.createElement('div')), z, {
        signed: true, ml: 44, mb: 30, height: name === 'W₁' ? 420 : 190,
        hover: name + ' out %{y} · in %{x}<br>%{z:.3f}<extra></extra>',
      });
    }
  }

  // ── 3 · Residual-stream trace, per token ─────────────────────────────────
  const tr = data.trace;
  const S = tr.stages.length;
  const trace = section(box, '3 · Residual-stream trace',
    `every token's hidden state at every point in the forward pass. Overview:
     how strongly each stage rewrites each token (L2 norm). Pick a token to see
     its full ${d}-dim vector at every stage and what title it resembles there.`);

  const norms = tr.vectors.map(stage =>
    stage.map(vec => Math.sqrt(vec.reduce((s, v) => s + v * v, 0))));
  heat(trace.appendChild(document.createElement('div')), norms, {
    ml: 150, mb: Math.min(220, 6 * maxLabel + 60),
    xaxis: { ...tokenAxis, tickangle: 45 },
    yaxis: { tickmode: 'array', tickvals: [...tr.stages.keys()], ticktext: tr.stages,
             autorange: 'reversed' },
    hover: '%{y}<br>token %{x}<br>‖h‖ %{z:.2f}<extra></extra>',
    height: 60 + 34 * S,
  });

  const sel = document.createElement('p');
  sel.innerHTML = `Trace token: <select id="trace-token">${fullTokens.map((f, i) =>
    `<option value="${i}" ${i === L - 1 ? 'selected' : ''}>${f}</option>`).join('')}</select>`;
  trace.appendChild(sel);
  const tokenPlot = trace.appendChild(document.createElement('div'));
  const tokenLens = trace.appendChild(document.createElement('div'));

  function drawTokenTrace(pos) {
    tokenPlot.innerHTML = '';
    heat(tokenPlot.appendChild(document.createElement('div')),
      tr.vectors.map(stage => stage[pos]), {
        signed: true, ml: 150, mb: 30,
        yaxis: { tickmode: 'array', tickvals: [...tr.stages.keys()], ticktext: tr.stages,
                 autorange: 'reversed' },
        hover: '%{y}<br>dim %{x}<br>value %{z:.3f}<extra></extra>',
        height: 60 + 34 * S,
      });
    tokenLens.innerHTML = `<table class="kv lens">
      <tr><th>stage</th><th>closest title (tied head)</th><th>prob</th></tr>
      ${tr.stages.map((s, si) => `<tr><td>${s}</td>
        <td>${tr.top1[si][pos].title}</td>
        <td>${(tr.top1[si][pos].prob * 100).toFixed(2)}%</td></tr>`).join('')}
    </table>`;
  }
  drawTokenTrace(L - 1);
  sel.querySelector('select').onchange = (e) => drawTokenTrace(+e.target.value);

  // ── 4 · Output head ──────────────────────────────────────────────────────
  section(box, '4 · Output head',
    'weight-tied to the input embedding table (section 1 shows those same ' +
    'vectors) — every hidden state is scored by dot product against all ' +
    'vocabulary embeddings. The logit-lens table at the top and the per-stage ' +
    'titles in the trace are exactly this projection.');
}

// ── Whole-model view (no prediction selected) ──────────────────────────────
function renderModelStatic(data, payload) {
  $('#head').innerHTML = `Model internals
    ${data.experiment ? `<span class="exp-badge">${data.experiment}</span>` : ''}
    <span class="hint">— ${data.label}</span>`;
  $('#meta').innerHTML = `<span>model run: <code>${data.model}</code></span>
    ${data.static && data.n_layers ? `<span>${data.n_layers} layers ·
      ${data.n_heads} heads · d_model ${data.d_model}</span>` : ''}
    <span>${(data.vocab_size || 0).toLocaleString()} vocabulary tokens</span>`;
  const box = $('#content');
  box.innerHTML = '';

  if (data.note) {
    box.insertAdjacentHTML('beforeend', `<p class="hint">${data.note}</p>`);
  }

  // Aggregate attention profile — the model as a whole
  if (data.type_attention) {
    const ta = data.type_attention;
    const prof = section(box, 'Attention profile — the model as a whole',
      `mean attention the [MASK] query pays to each token TYPE, averaged over
       ${ta.n_resumes} held-out resumes — each head's job, independent of any
       single resume. Rows are heads, columns token types.`);
    ta.mean.forEach((heads, li) => {
      prof.insertAdjacentHTML('beforeend', `<h4>encoder layer ${li + 1}</h4>`);
      heat(prof.appendChild(document.createElement('div')), heads, {
        ml: 70, mb: 40, text: true,
        xaxis: { tickmode: 'array', tickvals: [...ta.types.keys()], ticktext: ta.types },
        yaxis: { tickmode: 'array', tickvals: [...heads.keys()],
                 ticktext: heads.map((_, h) => `head ${h + 1}`), autorange: 'reversed' },
        hover: '%{y} → %{x}<br>mean attention %{z:.3f}<extra></extra>',
        height: 60 + 44 * heads.length,
      });
    });
  }

  // Learned weights per layer/head (input-independent)
  if (data.layers) {
    const d = data.d_model;
    const enc = section(box, 'Learned weights',
      'the trained parameters of every block — what the model IS, before any resume goes in');
    data.layers.forEach((layer, i) => {
      const ldet = collapsible(enc, `<b>${layer.name}</b>`, i === 0);
      layer.heads.forEach((W, h) => {
        const hdet = collapsible(ldet, `head ${h + 1} — W_Q, W_K, W_V, W_Oᵀ`, false);
        const grid = document.createElement('div');
        grid.className = 'weights-grid';
        hdet.appendChild(grid);
        for (const [name, z] of [['W_Q', W.wq], ['W_K', W.wk], ['W_V', W.wv], ['W_Oᵀ', W.wo_t]]) {
          const cell = document.createElement('div');
          cell.innerHTML = `<p class="hint">${name}</p>`;
          grid.appendChild(cell);
          heat(cell.appendChild(document.createElement('div')), z, {
            signed: true, ml: 40, mb: 30, height: 190,
            hover: name + ' head-dim %{y} · model-dim %{x}<br>%{z:.3f}<extra></extra>',
          });
        }
      });
      const f = collapsible(ldet, `FFN weights — W₁ then W₂`, false);
      for (const [name, z] of [['W₁', layer.ffn.w1], ['W₂', layer.ffn.w2]]) {
        f.insertAdjacentHTML('beforeend', `<p class="hint">${name}</p>`);
        heat(f.appendChild(document.createElement('div')), z, {
          signed: true, ml: 44, mb: 30, height: name === 'W₁' ? 420 : 190,
          hover: name + ' out %{y} · in %{x}<br>%{z:.3f}<extra></extra>',
        });
      }
    });
  }

  // Drill down: a resume → its top predictions → per-title trace. When the
  // page was opened from a prediction card, THAT resume is loaded first (the
  // inner workings of the prediction just made); the run's held-out samples
  // are selectable alternatives.
  const fromPrediction = !!(payload.tokens && payload.tokens.length);
  const drill = section(box, 'Drill down to one recommendation',
    (fromPrediction
      ? 'loaded with the resume you just predicted — click a predicted title '
      : 'pick a held-out resume, then click a predicted title ') +
    'to trace exactly how this model produced it — attention arithmetic, ' +
    'per-token influence, the lot.');
  drill.innerHTML = `<p>Resume: <select id="drill-sample"><option>loading…</option></select></p>
    <div id="drill-preds" class="hint">pick a resume to see its top predictions</div>`;
  (async () => {
    const s = await (await fetch('/api/samples?run=' + encodeURIComponent(data.model))).json();
    const options = [];
    if (fromPrediction) {
      options.push({ label: '★ this prediction’s resume',
                     context_tokens: payload.tokens, target: payload.target });
    }
    options.push(...s.samples);
    const sel = $('#drill-sample');
    if (!options.length) {
      sel.outerHTML = '<span class="hint">no sample resumes staged for this run — ' +
        'use “Build from dataset” on the main page first</span>';
      return;
    }
    sel.innerHTML = options.map((x, i) =>
      `<option value="${i}">${x.label}</option>`).join('');
    async function drillPredict(i) {
      const sample = options[i];
      $('#drill-preds').textContent = 'predicting…';
      const res = await (await fetch('/api/predict', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ tokens: sample.context_tokens, target: sample.target,
                               top_k: 10, models: [data.model] }),
      })).json();
      const r = res.results[data.model];
      if (!r || r.error) { $('#drill-preds').textContent = r ? r.error : 'failed'; return; }
      $('#drill-preds').innerHTML = r.predictions.map(p => `
        <button class="ghost drill-title" data-title="${p.token}">
          ${short(p.token)} <span class="hint">${(p.score * 100).toFixed(1)}%</span>
        </button>`).join(' ');
      document.querySelectorAll('.drill-title').forEach(btn => {
        btn.onclick = () => {
          const key = 'cpt_drill_' + btn.dataset.title;
          localStorage.setItem(key, JSON.stringify({
            tokens: sample.context_tokens, model: data.model, label: data.label,
            title: btn.dataset.title, target: sample.target,
          }));
          location.hash = encodeURIComponent(key);
          location.reload();
        };
      });
    }
    sel.onchange = (e) => drillPredict(+e.target.value);
    drillPredict(0);
  })();
}

(async function init() {
  const key = decodeURIComponent(location.hash.slice(1));
  const payload = JSON.parse(localStorage.getItem(key) || 'null');
  if (!payload) {
    return fail('No inspection payload found — open this page by clicking a ' +
                'predicted title in the demo (the payload is handed over per tab).');
  }
  const res = await fetch('/api/inspect', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ tokens: payload.tokens, model: payload.model, title: payload.title }),
  });
  const data = await res.json();
  if (data.error) return fail(data.error, data.not_displayable === true);
  if (!payload.title) {
    document.title = `${payload.label} — model internals`;
    renderModelStatic(data, payload);
    return;
  }
  renderHeader(payload);
  document.title = `${short(payload.title)} — ${payload.label} — inspector`;
  if (data.architecture === 'item2vec') renderItem2vec(data);
  else renderBert4rec(data);

  // Top-N control: cap every influence list to the top N rows by magnitude
  // (rows are pre-sorted, so index = rank). Blank = all. Rows are hidden, not
  // re-rendered, so it never re-plots the heatmaps.
  function applyTopN() {
    const n = parseInt($('#top-n').value, 10);
    document.querySelectorAll('.token-influence').forEach(list => {
      list.querySelectorAll('.contrib-row').forEach((row, i) => {
        row.style.display = (!n || i < n) ? '' : 'none';
      });
    });
  }
  const ctrl = $('#topn-ctrl');
  if (document.querySelector('.token-influence')) {
    ctrl.style.display = '';
    $('#top-n').oninput = applyTopN;
  }
})();
</script>
